name: Evals

# Every run calls the model (about $1.25 for the full suite at list price),
# so the suite runs only on demand.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case and arm
        default: "3"
      max_cost_usd:
        description: Cost ceiling in USD (list-price estimate)
        default: "8"

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.296"
  DISABLE_AUTOUPDATER: "1"

jobs:
  evals:
    name: Plugin evals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Models are pinned so that a model rollout is not mistaken for a plugin regression.
      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: |
          claude plugin eval . \
            --scaffold --allow-tools Edit Write --trust-plugin \
            --model claude-sonnet-5-5 --judge-model claude-haiku-5-5 \
            --runs "$RUNS" --threshold 0.8 --max-cost-usd "$MAX_COST_USD" \
            --no-publish --json evals/results/result.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
